<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3F72AF" />
    <meta name="description" content="YARBA - Yet Another Resume Builder App" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/dreaming-outloud-pro" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(-45deg, #f7fafc, #edf2f7, #e6edf5, #ebedff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      .slide-up {
        animation: slideUp 0.4s ease-out forwards;
      }

      .MuiButton-root,
      .MuiCard-root,
      .MuiListItemButton-root:not(.nav-item),
      .MuiAvatar-root {
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out,
          background-color 0.2s ease-in-out;
      }

      .MuiTooltip-popper {
        transition: none !important;
      }
    </style>
    <title>YARBA - Resume Builder</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
